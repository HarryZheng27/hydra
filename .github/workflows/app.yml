name: App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app.yml'
      - 'app/**'
      - 'src/core/**'
      - 'src/host/**'
      - 'webview/**'
      - 'src/uninstall.ts'
      - 'packs/**'
      - 'desktop/hydra-update-mode.iss'
      - 'desktop/hydra-wizard.iss'
      - 'scripts/app-installer-test.ps1'
      - 'scripts/coexistence-test.ps1'
      - 'desktop/upgrade-baseline.json'
      - 'scripts/desktop-icons.ps1'
      - 'hydra-logo.png'
  pull_request:
    paths:
      - '.github/workflows/app.yml'
      - 'app/**'
      - 'src/core/**'
      - 'src/host/**'
      - 'webview/**'
      - 'src/uninstall.ts'
      - 'packs/**'
      - 'desktop/hydra-update-mode.iss'
      - 'desktop/hydra-wizard.iss'
      - 'scripts/app-installer-test.ps1'
      - 'scripts/coexistence-test.ps1'
      - 'desktop/upgrade-baseline.json'
      - 'scripts/desktop-icons.ps1'
      - 'hydra-logo.png'
  # The Windows desktop workflow's stable release builds the app here too, as a stable package that updates itself.
  workflow_call:
    inputs:
      channel:
        description: 'The packaged app''s release channel: stable or preview.'
        type: string
        default: preview
      preview:
        description: 'An app preview''s number n: its installer is version <version>.n (app-preview.yml).'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  app:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # The app bundles ../src/core and ../webview, whose dependencies come from the root package.
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm run check
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run smoke
        working-directory: app
      # G6: the packaged app (fuses, integrity-checked archive) and its per-user installer, with an older copy of the
      # same package for the update case; the lifecycle test runs only here, on a disposable runner. Only the desktop
      # workflow's stable release asks for the stable channel; everything else is a preview, which never updates itself.
      - run: node scripts/package.mjs --installer --prior=0.0.1 --channel=${{ inputs.channel == 'stable' && 'stable' || 'preview' }} ${{ inputs.preview && format('--preview={0}', inputs.preview) || '' }}
        working-directory: app
      - run: ./scripts/app-installer-test.ps1 -InstallerPath app/out/installer/HydraAppSetup.exe -PriorInstallerPath app/out/installer-prior/HydraAppSetup.exe
        shell: pwsh
      # Side by side with an installed Hydra IDE: the pinned release the IDE's upgrade test uses, checked by its SHA-256.
      - name: Coexistence with Hydra IDE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Get-Content -LiteralPath desktop/upgrade-baseline.json -Raw | ConvertFrom-Json
          if ($baseline.source -ne 'release') { throw 'The pinned IDE baseline is not a release.' }
          gh release download $baseline.tag --repo $env:GITHUB_REPOSITORY --pattern HydraSetup.exe --dir ide-release
          if ($LASTEXITCODE -ne 0) { throw "Downloading $($baseline.tag)'s HydraSetup.exe failed." }
          if ((Get-FileHash -LiteralPath ide-release/HydraSetup.exe -Algorithm SHA256).Hash -ne $baseline.installerSha256) { throw 'The IDE installer does not match the pinned SHA-256.' }
          ./scripts/coexistence-test.ps1 -IdeInstallerPath ide-release/HydraSetup.exe -AppInstallerPath app/out/installer/HydraAppSetup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hydra-app-coexistence-test-logs
          path: coexistence-test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hydra-app-installer-test-logs
          path: app/out/installer-test-logs/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Hydra-app-win32-x64-installer
          path: app/out/installer/HydraAppSetup.exe
          if-no-files-found: error
          retention-days: 7
