name: Windows desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (v<package.json version>) once every check passes. Leave empty for no release.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release.'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'scripts/desktop*'
      - 'scripts/build.mjs'
      - 'scripts/smoke.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'webview/**'
      - 'themes/**'
      - 'media/**'
      - 'native/**'
      - 'hydra-logo.png'

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure native Spectre build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerDir = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
          $vswhere = Join-Path $installerDir 'vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio 2022 C++ toolchain is missing.' }
          $components = @(
            'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre',
            'Microsoft.VisualStudio.Component.VC.ATL.Spectre',
            'Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre'
          )
          $ready = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires $components -property installationPath
          if ($ready -ne $vsPath) {
            $installerArgs = @('modify', '--installPath', ('"' + $vsPath + '"'), '--quiet', '--norestart')
            foreach ($component in $components) { $installerArgs += @('--add', $component) }
            # setup.exe has no --wait switch; PowerShell waits for the process tree.
            $install = Start-Process -FilePath (Join-Path $installerDir 'setup.exe') -ArgumentList $installerArgs -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -notin @(0, 3010)) { throw "Visual Studio component install failed: $($install.ExitCode)" }
            $ready = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires $components -property installationPath
            if ($ready -ne $vsPath) { throw 'Spectre component verification failed.' }
          }
          "GYP_MSVS_VERSION=2022" >> $env:GITHUB_ENV
      - name: Verify prior tested upgrade artifact provenance
        id: upgrade-baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const baseline = JSON.parse(fs.readFileSync('desktop/upgrade-baseline.json', 'utf8'));
            if (baseline.source === 'release') {
              // A published release doesn't expire like a CI artifact. Its tag must still point at the
              // recorded commit, it must be published, and GitHub's digest for the installer asset must
              // match the pinned hash (the upgrade script checks the downloaded file's hash again).
              if (typeof baseline.version !== 'string' || !/^\d+\.\d+\.\d+$/.test(baseline.version) || baseline.tag !== `v${baseline.version}`) throw new Error('Pinned release tag must be v<version>.');
              if (baseline.assetName !== 'HydraSetup.exe' || !/^[a-f0-9]{64}$/i.test(baseline.installerSha256 || '') || !/^[a-f0-9]{40}$/.test(baseline.headSha || '')) throw new Error('Pinned release baseline is incomplete.');
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: baseline.tag });
              if (release.draft) throw new Error('Pinned release is still a draft.');
              const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${baseline.tag}` });
              let commit = ref.object.sha;
              if (ref.object.type === 'tag') commit = (await github.rest.git.getTag({ ...context.repo, tag_sha: commit })).data.object.sha;
              if (commit !== baseline.headSha) throw new Error('Pinned release tag no longer points at the recorded commit.');
              const asset = release.assets.find(item => item.name === baseline.assetName);
              if (!asset || asset.state !== 'uploaded') throw new Error('Pinned release installer asset is missing.');
              if (asset.digest && asset.digest.toLowerCase() !== `sha256:${baseline.installerSha256.toLowerCase()}`) throw new Error('Pinned release installer digest does not match the pinned hash.');
              core.setOutput('source', 'release');
              core.setOutput('tag', baseline.tag);
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: baseline.runId });
            if (run.conclusion !== 'success' || run.head_sha !== baseline.headSha || run.path !== '.github/workflows/desktop.yml') throw new Error('Pinned prior installer run has not passed the exact expected Windows workflow/head.');
            const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: baseline.artifactId });
            if (artifact.expired || artifact.name !== baseline.artifactName || artifact.digest !== baseline.artifactDigest || artifact.workflow_run?.id !== baseline.runId || artifact.workflow_run?.head_sha !== baseline.headSha) throw new Error('Pinned prior installer artifact is expired or its provenance changed. Revalidate a replacement baseline explicitly.');
            core.setOutput('source', 'artifact');
            core.setOutput('run-id', String(baseline.runId));
            core.setOutput('artifact-id', String(baseline.artifactId));
      - name: Download pinned prior release installer
        if: steps.upgrade-baseline.outputs.source == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_TAG: ${{ steps.upgrade-baseline.outputs.tag }}
        run: gh release download $env:PINNED_TAG --repo $env:GITHUB_REPOSITORY --pattern HydraSetup.exe --dir .desktop/upgrade-prior
      - name: Download pinned prior tested installer
        if: steps.upgrade-baseline.outputs.source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.upgrade-baseline.outputs.run-id }}
          artifact-ids: ${{ steps.upgrade-baseline.outputs.artifact-id }}
          merge-multiple: true
          path: .desktop/upgrade-prior
      - run: npm.cmd ci
      - name: Verify native Authenticode boundary with signed Windows fixture
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-verifier-test.ps1
      - name: Verify native installed-inventory signature bytes
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-inventory-signature-test.ps1
      - name: Verify native installed-inventory schema after signature
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-inventory-schema-test.ps1
      - name: Verify native installed-payload tree under retained handles
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-inventory-tree-test.ps1
      - name: Verify native operation path and replacement locks
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-locked-path-test.ps1
      - name: Verify signed staged installer through held native lease
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-staged-verifier-test.ps1
      - name: Verify disabled native helper identity preflight
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-helper-preflight-test.ps1
      - name: Verify restricted interactive token preflight
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-msix-install-test.ps1 -TokenPreflightOnly
      - run: npm.cmd run desktop:build
        env:
          # Upstream ripgrep uses GitHub's release API; avoid shared-runner anonymous limits.
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm.cmd run desktop:smoke
      - name: Verify fixture MSIX install and protected payload
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\desktop-msix-install-test.ps1 -BuiltAppPath .desktop\VSCode-win32-x64 -Upgrade -WrongPublisher
      - run: npm.cmd run desktop:installer
      - name: Verify built installer PE identity with native handle reader
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\desktop-native-pe-identity-test.ps1
      - name: Verify installer lifecycle on disposable runner
        shell: pwsh
        run: ./scripts/desktop-installer-test.ps1 -InstallerPath .desktop/code-oss/.build/win32-x64/user-setup/HydraSetup.exe
      - name: Verify distinct-version upgrade on disposable runner
        shell: pwsh
        run: ./scripts/desktop-upgrade-test.ps1 -PriorInstallerPath .desktop/upgrade-prior/HydraSetup.exe -InstallerPath .desktop/code-oss/.build/win32-x64/user-setup/HydraSetup.exe -BuiltAppPath .desktop/VSCode-win32-x64
      - name: Upload tested user installer
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-win32-x64-user-installer
          path: .desktop/code-oss/.build/win32-x64/user-setup/HydraSetup.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-installer-test-logs
          path: .desktop/installer-test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload MSIX acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-msix-test-logs
          path: .desktop/msix-test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-upgrade-test-logs
          path: .desktop/upgrade-test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload standalone editor
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-win32-x64
          path: .desktop/VSCode-win32-x64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Release trust (Step 4): only a manual run with a release tag publishes,
  # and only after the desktop job's build, smoke, installer, upgrade and MSIX checks have all passed.
  # This job alone may write: the release, and the installer's build-provenance attestation.
  release:
    needs: desktop
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      # Whether the release owner has set the update-signing secrets; the secrets themselves reach
      # only the signing step (Step 4.2).
      HAS_UPDATE_KEY: ${{ secrets.HYDRA_UPDATE_SIGNING_KEY != '' && secrets.HYDRA_UPDATE_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - name: Check the tag names this build's version and isn't taken
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw "The release tag $env:RELEASE_TAG doesn't match package.json's version $version." }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists." }
          $global:LASTEXITCODE = 0
          "HYDRA_VERSION=$version" >> $env:GITHUB_ENV
      - name: Download the tested installer
        uses: actions/download-artifact@v4
        with:
          name: Hydra-win32-x64-user-installer
          path: release
      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = (Get-FileHash -LiteralPath release/HydraSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          # The format sha256sum -c reads: "<hash>  <file name>".
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS'), "$hash  HydraSetup.exe`n")
      - name: Attest the installer's build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/HydraSetup.exe
      - name: Decide whether to sign update metadata
        id: signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Signed update metadata (Step 4.2) needs the owner's signing key and a code-signed installer:
          # the signed record names the installer's Authenticode signer, and clients check it before installing.
          $status = (Get-AuthenticodeSignature -LiteralPath release/HydraSetup.exe).Status
          if ($env:HAS_UPDATE_KEY -ne 'true') { "::notice::No update-signing key is set, so no signed update metadata was made."; "sign=false" >> $env:GITHUB_OUTPUT }
          elseif ("$status" -ne 'Valid') { "::notice::The installer isn't code-signed (Authenticode: $status), so no signed update metadata was made."; "sign=false" >> $env:GITHUB_OUTPUT }
          else { "sign=true" >> $env:GITHUB_OUTPUT }
      - name: Install the signing script's build tool (no secrets here)
        if: steps.signing.outputs.sign == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sign update metadata
        if: steps.signing.outputs.sign == 'true'
        shell: pwsh
        env:
          HYDRA_UPDATE_SIGNING_KEY: ${{ secrets.HYDRA_UPDATE_SIGNING_KEY }}
          HYDRA_UPDATE_KEY_ID: ${{ secrets.HYDRA_UPDATE_KEY_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The signed inventory must match installed bytes (the installer rewrites product.json), so install
          # this exact installer silently into a throwaway folder and sign what it put there.
          $installRoot = Join-Path $env:RUNNER_TEMP 'hydra-installed'
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NORESTARTAPPLICATIONS', ('/DIR="' + $installRoot + '"'), '/MERGETASKS=!desktopicon,!runcode')
          $process = Start-Process -FilePath (Resolve-Path release/HydraSetup.exe) -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The installer failed: $($process.ExitCode)" }
          # Clients refuse a sequence that isn't strictly higher than the last one they saw, and a reused one
          # with other bytes: seconds since 1970 always grow, re-runs included. Issued a few minutes back so
          # a client whose clock runs slightly behind still accepts it.
          $sequence = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $issued = [DateTimeOffset]::UtcNow.AddMinutes(-5).ToString('yyyy-MM-ddTHH:mm:ssZ')
          New-Item -ItemType Directory -Force -Path release-update | Out-Null
          node scripts/desktop-update-sign.mjs --installer release/HydraSetup.exe --installed $installRoot --version $env:HYDRA_VERSION --commit $env:GITHUB_SHA --sequence $sequence --issued $issued --out release-update/user.json
          if ($LASTEXITCODE -ne 0) { throw 'Signing the update metadata failed.' }
      - name: Keep the signed update metadata for the update host
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Served unchanged at <origin>/channels/stable/win32-x64/user.json (clients follow no redirects,
          # so a GitHub release asset can't serve it).
          name: Hydra-signed-update-metadata
          path: release-update/user.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = @(
            "Hydra $env:HYDRA_VERSION, built from $env:GITHUB_SHA by run $env:GITHUB_RUN_ID after every desktop check passed.",
            '',
            'To check the installer you downloaded:',
            '- Its SHA-256 must match `SHA256SUMS`: `Get-FileHash .\HydraSetup.exe -Algorithm SHA256` in PowerShell.',
            "- Its build provenance: ``gh attestation verify HydraSetup.exe --repo $env:GITHUB_REPOSITORY``.",
            '',
            'The installer is not code-signed yet, so Windows SmartScreen may warn before it runs.'
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'notes.md'), $notes)
          $flags = @('--target', $env:GITHUB_SHA, '--title', "Hydra $env:HYDRA_VERSION", '--notes-file', (Join-Path $env:RUNNER_TEMP 'notes.md'))
          if ($env:PRERELEASE -eq 'true') { $flags += '--prerelease' }
          gh release create $env:RELEASE_TAG release/HydraSetup.exe release/SHA256SUMS --repo $env:GITHUB_REPOSITORY @flags
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
